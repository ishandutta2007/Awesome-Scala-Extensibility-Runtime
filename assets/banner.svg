<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1026" />
    </linearGradient>

    <linearGradient id="scala-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DE3423" />
      <stop offset="50%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#FF7961" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <radialGradient id="glow-orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DE3423" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#DE3423" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.22" />
    </pattern>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.35; }
        50% { transform: scale(1.18); opacity: 0.65; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-16px) translateX(8px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes flowStroke {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes beamMove {
        0% { transform: translateX(0); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateX(800px); opacity: 0; }
      }
      .anim-glow1 {
        transform-origin: 200px 100px;
        animation: pulseGlow 7s ease-in-out infinite;
      }
      .anim-glow2 {
        transform-origin: 980px 260px;
        animation: pulseGlow 8s ease-in-out infinite 2s;
      }
      .anim-particle1 { animation: floatParticle 5s ease-in-out infinite; }
      .anim-particle2 { animation: floatParticle 7s ease-in-out infinite 1.5s; }
      .anim-particle3 { animation: floatParticle 6s ease-in-out infinite 3s; }
      .anim-stream {
        stroke-dasharray: 12 12;
        animation: flowStroke 12s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Ambient Glows (Behind Everything) -->
  <circle cx="200" cy="110" r="220" fill="url(#glow-orb1)" class="anim-glow1" />
  <circle cx="1020" cy="270" r="240" fill="url(#glow-orb2)" class="anim-glow2" />
  <circle cx="620" cy="200" r="180" fill="url(#glow-orb3)" class="anim-glow1" />

  <!-- Grid Overlay -->
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />

  <!-- Geometric & Dynamic Architecture Elements (Background layer) -->
  <g opacity="0.35">
    <path d="M 50 320 C 300 200, 450 360, 700 280 S 1000 120, 1150 160" fill="none" stroke="#DE3423" stroke-width="2" class="anim-stream" />
    <path d="M 80 100 C 320 220, 600 60, 850 180 S 1050 320, 1160 290" fill="none" stroke="#3B82F6" stroke-width="1.5" class="anim-stream" style="animation-direction: reverse;" />
  </g>

  <!-- Dynamic Constellation Nodes (Representing actor systems & cluster workers) -->
  <g class="anim-particle1" opacity="0.6">
    <circle cx="150" cy="80" r="4" fill="#FF5252" filter="url(#neon-glow)" />
    <circle cx="280" cy="60" r="3" fill="#3B82F6" />
    <line x1="150" y1="80" x2="280" y2="60" stroke="#FF5252" stroke-width="1" stroke-opacity="0.4" />
  </g>
  <g class="anim-particle2" opacity="0.6">
    <circle cx="1060" cy="110" r="4.5" fill="#38BDF8" filter="url(#neon-glow)" />
    <circle cx="940" cy="70" r="3" fill="#C084FC" />
    <circle cx="1120" cy="80" r="3.5" fill="#FF7961" />
    <line x1="940" y1="70" x2="1060" y2="110" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" />
    <line x1="1060" y1="110" x2="1120" y2="80" stroke="#C084FC" stroke-width="1" stroke-opacity="0.3" />
  </g>
  <g class="anim-particle3" opacity="0.6">
    <circle cx="90" cy="270" r="3.5" fill="#A855F7" />
    <circle cx="210" cy="310" r="4" fill="#FF5252" filter="url(#neon-glow)" />
    <line x1="90" y1="270" x2="210" y2="310" stroke="#A855F7" stroke-width="1" stroke-opacity="0.3" />
  </g>

  <!-- High-Contrast Foreground Container Card (Ensures absolute text clarity) -->
  <rect x="70" y="45" width="1060" height="290" rx="14" fill="#0F172A" fill-opacity="0.75" stroke="#334155" stroke-opacity="0.5" stroke-width="1.2" filter="url(#shadow)" />

  <!-- Decorative Top Bar -->
  <path d="M 70 57 A 12 12 0 0 1 82 45 L 1118 45 A 12 12 0 0 1 1130 57 L 1130 59 L 70 59 Z" fill="url(#scala-red)" />

  <!-- Category Badges / Pills in Header -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="170" height="26" rx="13" fill="#DE3423" fill-opacity="0.2" stroke="#DE3423" stroke-width="1.2" />
    <circle cx="12" cy="13" r="4" fill="#FF5252" />
    <text x="24" y="17" fill="#FECDD3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">SCALA ECOSYSTEM</text>
  </g>

  <g transform="translate(285, 80)">
    <rect x="0" y="0" width="160" height="26" rx="13" fill="#0284C7" fill-opacity="0.2" stroke="#0284C7" stroke-width="1.2" />
    <circle cx="12" cy="13" r="4" fill="#38BDF8" />
    <text x="24" y="17" fill="#BAE6FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">CLOUD &amp; DISTRIBUTED</text>
  </g>

  <g transform="translate(460, 80)">
    <rect x="0" y="0" width="135" height="26" rx="13" fill="#7C3AED" fill-opacity="0.2" stroke="#7C3AED" stroke-width="1.2" />
    <circle cx="12" cy="13" r="4" fill="#C084FC" />
    <text x="24" y="17" fill="#E9D5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">ACTOR RUNTIMES</text>
  </g>

  <!-- FOREGROUND MAIN TITLE -->
  <text x="100" y="165" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" filter="url(#shadow)">
    Awesome Scala Extensibility &amp; Runtime
  </text>

  <!-- FOREGROUND SUBTITLE -->
  <text x="100" y="205" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" letter-spacing="0.2">
    Curated Hub of Managed Cloud Platforms, Distributed Compute Engines &amp; High-Performance Runtimes
  </text>

  <!-- DIVIDER LINE -->
  <line x1="100" y1="230" x2="1100" y2="230" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />

  <!-- FEATURE TAGS (FOREGROUND PILLS) -->
  <g transform="translate(100, 255)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="38" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="15" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Scala UDF Runtimes</text>

    <!-- Pill 2 -->
    <rect x="195" y="0" width="220" height="38" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="210" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🌐 Apache Spark &amp; Compute</text>

    <!-- Pill 3 -->
    <rect x="430" y="0" width="220" height="38" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="445" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🎭 Akka &amp; Pekko Actor Systems</text>

    <!-- Pill 4 -->
    <rect x="665" y="0" width="195" height="38" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="680" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🚀 Scala Native &amp; AOT</text>
  </g>

  <!-- Live Status Beacon in Top Right -->
  <g transform="translate(980, 75)">
    <circle cx="10" cy="10" r="5" fill="#10B981" filter="url(#neon-glow)" />
    <circle cx="10" cy="10" r="10" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.6" class="anim-glow1" />
    <text x="28" y="14" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">CURATED 2026</text>
  </g>
</svg>